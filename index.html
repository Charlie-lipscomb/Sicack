<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sicack — Reddit Clone</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #dae0e6;
        color: #1a1a1b;
      }
      #boot {
        max-width: 480px;
        margin: 80px auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
        line-height: 1.5;
      }
      #boot code {
        background: #f6f7f8;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1 style="color: #ff4500; margin-top: 0">Sicack</h1>
        <p>Loading app…</p>
        <p style="font-size: 0.85rem; color: #7c7c7c">
          If this message never goes away, the JavaScript did not load.<br /><br />
          <strong>Local:</strong> run <code>npm install</code> then <code>npm run dev</code><br />
          and open the URL Vite prints (usually <code>http://localhost:5173</code>).<br /><br />
          <strong>GitHub Pages:</strong> Settings → Pages → Source must be
          <strong>GitHub Actions</strong>, then wait for the deploy workflow to finish.
        </p>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
